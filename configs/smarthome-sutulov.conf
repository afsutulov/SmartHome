  "devices": [
    {
      "id": "polotense01",
      "name": "Полотенцесушитель",
      "type": "switch",
      "zigbee_id": "0x540f57fffe8ec162",
      "yandex_id": "Polotense01",
      "initial": {
        "state": true
      },
      "actions": {
        "on": {
          "title": "ВКЛ",
          "set_state": true,
          "publishes": [
            {
              "topic": "{{index .BaseTopic 0}}/{{.Device.ZigbeeID}}/set",
              "payload": {
                "state": "ON",
                "power_outage_memory": "restore"
              }
            },
            {
              "topic": "/{{index .BaseTopic 1}}/{{.Device.YandexID}}/state",
              "payload": "true"
            }
          ]
        },
        "off": {
          "title": "ВЫКЛ",
          "set_state": false,
          "publishes": [
            {
              "topic": "{{index .BaseTopic 0}}/{{.Device.ZigbeeID}}/set",
              "payload": {
                "state": "OFF",
                "power_outage_memory": "restore"
              }
            },
            {
              "topic": "/{{index .BaseTopic 1}}/{{.Device.YandexID}}/state",
              "payload": "false"
            }
          ]
        }
      },
      "reports": [
        {
          "name": "state_yandex",
          "topic": "/{{index .BaseTopic 1}}/{{.Device.YandexID}}/state",
          "expression": "eq(payload.state,'ON')"
        }
      ]
    },
